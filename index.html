<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <style>
        .unit-toggle {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font: 16px Arial, sans-serif;
          cursor: pointer;
          user-select: none;
        }

        .unit-toggle input {
          display: none;
        }

        .switch {
          width: 42px;
          height: 22px;
          background: #fa0000;
          border-radius: 20px;
          position: relative;
          transition: background 0.2s;
        }

        .knob {
          width: 18px;
          height: 18px;
          background: white;
          border-radius: 50%;
          position: absolute;
          top: 2px;
          left: 2px;
          transition: transform 0.2s;
          box-shadow: 0 1px 3px rgba(0,0,0,.3);
        }

        .unit-toggle input:checked + .switch {
          background: #02f30e;
        }


        .unit-toggle input:checked + .switch .knob {
          transform: translateX(20px);
        }   

    </style>
    </head>
    <body>
      <canvas id="myCanvas" width="500" height="500"></canvas>
      <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        // Create an image object
        const img = new Image();
  
        // Set the source to your SVG file path
        img.src = 'cards/2002.svg';

        // Wait for the SVG to load before drawing
        img.onload = function() {
          ctx.drawImage(img, 0, 0, 40, 60); // (image, x, y, width, height)
        };
      </script>
    </body>
</html>
